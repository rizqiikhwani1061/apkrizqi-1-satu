<!DOCTYPE html>
<html>
<head>
    <title>Kalkulator Sederhana</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 
20px; background: #f0f8ff; }
        .kalkulator { background: rgb(158, 238, 250); padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; }
        input { padding: 10px; margin: 5px; font-size: 16px; width: 80%; box-sizing: border-box; }
        button { padding: 10px 15px; margin: 5px; font-size: 16px; background: #f4f7f8; color: rgb(31, 26, 26); border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #e8dd06; }
        .hasil { font-size: 28px; font-weight: bold; color: #2c3e50; margin-top: 20px; }
    </style>
</head>
<body>
    <div style="text-align: left; margin-bottom: 20px;">
        <a href="../index.html"
            style="text-decoration: none; color: #2c3e50; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; padding: 8px 12px; background: rgba(158, 238, 250, 0.5); border-radius: 5px;">
            &larr; Kembali ke portofolio
        </a>
    </div>
    <div class="kalkulator">
        <h2>🧮 Kalkulator</h2>
        <input type="number" id="angka1" placeholder="Masukkan Angka Pertama"><br>
        <input type="number" id="angka2" placeholder="Masukkan Angka Kedua"><br><br>
        <button onclick="tambah()">+</button>
        <button onclick="kurang()">-</button>
        <button onclick="kali()">×</button>
        <button onclick="bagi()">÷</button>
        <button onclick="resetKalkulator()" style="background: #f00505; color: white;">Reset</button>
        <div class="hasil">Hasil: <span id="hasilAngka">0</span></div>
    </div>

    <script>
        function tambah() {
            let a = Number(document.getElementById('angka1').value);
            let b = Number(document.getElementById('angka2').value);
            document.getElementById('hasilAngka').innerHTML = a + b;
        }

        function kurang() {
            let a = Number(document.getElementById('angka1').value);
            let b = Number(document.getElementById('angka2').value);
            document.getElementById('hasilAngka').innerHTML = a - b;
        }

        function kali() {
            let a = Number(document.getElementById('angka1').value);
            let b = Number(document.getElementById('angka2').value);
            document.getElementById('hasilAngka').innerHTML = a * b;
        }

        function bagi() {
            let a = Number(document.getElementById('angka1').value);
            let b = Number(document.getElementById('angka2').value);
            
            if (b === 0) {
                alert('Peringatan: Tidak bisa membagi angka dengan 0!');
                return;
            }
            document.getElementById('hasilAngka').innerHTML = a / b;
        }

        function resetKalkulator() {
            document.getElementById('angka1').value = "";
            document.getElementById('angka2').value = "";
            document.getElementById('hasilAngka').innerHTML = '0';
        }
    </script>
</body>
</html>
