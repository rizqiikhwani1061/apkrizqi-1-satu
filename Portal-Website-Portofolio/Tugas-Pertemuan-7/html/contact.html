<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Portofolio Saya</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav>
        <div class="container">
            <div class="logo">MyPortofolio</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><button id="theme-toggle" class="btn-toggle">Dark Mode</button></li>
            </ul>
        </div>
    </nav>

    <section class="page-section">
        <div class="container">
            <h2>Hubungi Saya</h2>
            <form id="contact-form" class="contact-form">
                <div class="form-group">
                    <label for="name">Nama Lengkap</label>
                    <input type="text" id="name" placeholder="Masukkan nama Anda">
                    <span id="name-error" class="error-msg">Nama tidak boleh kosong!</span>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Masukkan email Anda">
                    <span id="email-error" class="error-msg">Email tidak valid!</span>
                </div>
                <div class="form-group">
                    <label for="message">Pesan</label>
                    <textarea id="message" rows="5" placeholder="Tulis pesan Anda"></textarea>
                    <span id="message-error" class="error-msg">Pesan tidak boleh kosong!</span>
                </div>
                <button type="submit" class="btn">Kirim Pesan</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 MyPortofolio</p>
    </footer>

    <script src="../js/main.js"></script>
</body>
</html>
